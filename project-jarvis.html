<!DOCTYPE html>
<html lang="en">

  <meta name="description"
        content="An early-stage UNC MEITE group project exploring parent involved academic planning that helps students preserve options and move towards college goals.">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #FAF8F0;
      color: #103554;
      font-family: Arial, sans-serif;
    }

    header {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    a {
      color: #103554;
      text-underline-offset: 4px;
    }

    a:hover {
      color: #2D79AD;
    }

    a:focus-visible {
      outline: 3px solid #FF591F;
      outline-offset: 5px;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 12px 32px;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
    }

    .image-link {
      margin: 16px 8px;

    }

<body>
  <header>
    <a href="index.html#portfolio">← Back to Portfolio</a>
  </header>

  <main aria-label="Project Jarvis portfolio">
    <img
      src="images/project-jarvis.png"
      alt="Project Jarvis, an early-stage UNC MEITE group project.
      Know where you're going. Build confidence you'll get there.
      Parent involved academic planning helps students preserve options
      and move towards college goals. Four steps: set your targets,
      assess your readiness, build your academic plan, and reassess
      and adjust. Students set goals, parents review and approve
      decisions, and counselors guide planning. Future direction:
      integration with school planning processes.
      Displayed figures are illustrative concept data."
